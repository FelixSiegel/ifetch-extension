name: Build and Publish Mihon Extension

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Signing Key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.release.tag_name }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Generate Repository JSONs
        run: |
          RAW_VERSION="${{ github.event.release.tag_name }}"
          CLEAN_VERSION="${RAW_VERSION#v}"

          # SHA256 fingerprint generated from release.jks
          FINGERPRINT="83b44f5565189b5b103e6b0b5c1aa37414082e857bbb9e5be3e0798eefdbfbf6"

          echo "{\"meta\":{\"name\":\"iFetch Repo\",\"shortName\":\"iFetch\",\"website\":\"https://github.com/${{ github.repository }}\",\"signingKeyFingerprint\":\"$FINGERPRINT\"}}" > repo.json

          echo "[{\"name\":\"iFetch API\",\"pkg\":\"eu.kanade.tachiyomi.extension.en.ifetch\",\"apk\":\"../ifetch.apk\",\"lang\":\"en\",\"code\":${{ github.run_number }},\"version\":\"$CLEAN_VERSION\",\"nsfw\":0,\"hasReadme\":0,\"hasChangelog\":0,\"sources\":[{\"id\":\"2265008544838634865\",\"name\":\"iFetch API\",\"lang\":\"en\",\"baseUrl\":\"http://192.168.2.18:8080\"}]}]" > index.min.json

          cp build/outputs/apk/release/*-release.apk ifetch.apk

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            repo.json
            index.min.json
            ifetch.apk
